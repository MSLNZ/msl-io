name: CI

on: [push, pull_request]

env:
  PY_COLORS: 1
  COLUMNS: 110
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [windows-latest, ubuntu-24.04, macos-latest]
        xml: [builtin]
        include:
          - python-version: "3.14"
            os: windows-latest
            xml: defusedxml
          - python-version: "3.9"
            os: ubuntu-24.04
            xml: defusedxml
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package (and test dependencies) (Python != 3.15)
        if: ${{ matrix.python-version != '3.15' }}
        run: |
          python -m pip install --upgrade pytest pytest-cov GTC
          python -m pip install --upgrade .[h5py,google] --prefer-binary
      - name: Install package (and test dependencies) (Python == 3.15)
        if: ${{ matrix.python-version == '3.15' }}
        run: |
          python -m pip install --upgrade pytest pytest-cov GTC
          python -m pip install --upgrade .[google] --prefer-binary
      - name: Install defusedxml
        if: ${{ matrix.xml == 'defusedxml' }}
        run: python -m pip install --upgrade defusedxml
      - name: Run tests
        run: |
          python -c "from msl.io.readers._xlrd.xlsx import ET; print(ET)"
          python -c "from msl.io.readers.ods import ET; print(ET)"
          python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: "3.14"
      - name: Spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          incremental_files_only: false
      - name: Linting
        run: uv run -- ruff check --force-exclude --no-fix .
      - name: Formatting
        run: uv run -- ruff format --force-exclude --check .
      - name: Typing:BasedPyright
        run: uv run -- basedpyright .
      - name: Typing:MyPy
        run: uv run -- mypy .
